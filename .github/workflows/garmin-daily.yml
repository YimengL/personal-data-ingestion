name: Garmin Daily Fetch

on:
    workflow_dispatch:
    schedule:
        - cron: '0 15 * * *'

jobs:
    fetch-garmin-data:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Build Garmin image
              run: docker build -t garmin-client -f garmin/Dockerfile .